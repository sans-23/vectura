<!DOCTYPE html>
<html>
<head>
    <title>Vectura Debug Viewer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="debug_route.js"></script> 

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        #controls {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 250px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>🚀 Vectura Viewer</h3>
        <div id="stats">Waiting for data...</div>
    </div>
    <div id="map"></div>

    <script>
        // Initialize Map
        const map = L.map('map').setView([12.9716, 77.5946], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // AUTO-LOAD LOGIC
        window.onload = function() {
            if (window.ROUTE_DATA) {
                renderRoute(window.ROUTE_DATA);
                document.getElementById('stats').innerHTML = "✅ Auto-loaded route!";
            } else {
                document.getElementById('stats').innerHTML = "⚠️ No route file found.<br>Drag & drop JSON here.";
            }
        };

        function renderRoute(geoJson) {
            const layer = L.geoJSON(geoJson, {
                style: function(feature) {
                    if (feature.geometry.type === "LineString") {
                        return { color: '#4285F4', weight: 5 };
                    }
                },
                pointToLayer: function (feature, latlng) {
                    if (feature.properties.type === 'warehouse') {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: "#EA4335",
                            color: "#ccc",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 1
                        }).bindPopup(feature.properties.name);
                    }
                    return L.marker(latlng);
                }
            }).addTo(map);
            map.fitBounds(layer.getBounds());
            
            // Safe access to distance, assuming the first feature is the route LineString
            const routeFeature = geoJson.features.find(f => f.geometry.type === "LineString");
            if(routeFeature && routeFeature.properties.distance_km) {
                document.getElementById('stats').innerHTML += `<br><b>Distance:</b> ${routeFeature.properties.distance_km.toFixed(2)} km`;
            }
        }
    </script>
</body>
</html>
